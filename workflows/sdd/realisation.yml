schema_version: "1.0"
workflow:
  id: "sdd-realisation"
  name: "SDD : réalisation (Phase 2)"
  version: "0.3.0"
  author: "equipe-dev"
  description: "Implement, vérification (types puis tests) avec au plus 2 corrections, puis Converge. Le dossier de la feature est passé explicitement, et l'exécution échoue si l'agent n'écrit rien ou si la vérification reste rouge."

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["gemini"]

inputs:
  integration:
    type: string
    default: "gemini"
    enum: ["gemini"]
    prompt: "Agent de codage à utiliser"
  test_cmd:
    type: string
    default: "npm run typecheck && npm test"
    enum: ["npm run typecheck && npm test", "npm test"]
    prompt: "Commande de vérification (types puis tests)"

steps:
  - id: feature
    type: shell
    run: "d=$(python3 -c \"import json; print(json.load(open('.specify/feature.json'))['feature_directory'])\") && test -s \"$d/tasks.md\" && echo \"$d\" || { echo \"tasks.md introuvable pour la feature : $d\" >&2; exit 1; }"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "La feature active est dans le dossier {{ steps.feature.output.stdout }} : travaille uniquement dans ce dossier pour la spec, le plan et les tâches. Implémente toutes les tâches de tasks.md dans l'ordre, tests avant le code correspondant, et coche chaque tâche terminée. Respecte la constitution du projet."

  - id: controle_ecriture
    type: shell
    run: "git status --porcelain | grep -Ev '^.. (specs|reports|.specify)/' | grep -q . && echo 'Du code a été écrit' || { echo \"L'agent n'a modifié aucun fichier de code\" >&2; exit 1; }"

  - id: verif_1
    type: shell
    run: "mkdir -p reports && ( {{ inputs.test_cmd }} ) > reports/test-report.txt 2>&1; echo TEST_EXIT=$?"

  - id: correction_1
    type: if
    condition: "{{ steps.verif_1.output.stdout | contains('TEST_EXIT=0') }}"
    then:
      - id: ok_1
        type: shell
        run: "echo Vérification au vert"
    else:
      - id: fix_1
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "La feature active est dans le dossier {{ steps.feature.output.stdout }}. La vérification (types ou tests) échoue. Lis reports/test-report.txt, identifie la cause, corrige le code ou les tests concernés, sans ajouter de fonctionnalité hors spec."

  - id: verif_2
    type: shell
    run: "mkdir -p reports && ( {{ inputs.test_cmd }} ) > reports/test-report.txt 2>&1; echo TEST_EXIT=$?"

  - id: correction_2
    type: if
    condition: "{{ steps.verif_2.output.stdout | contains('TEST_EXIT=0') }}"
    then:
      - id: ok_2
        type: shell
        run: "echo Vérification au vert"
    else:
      - id: fix_2
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        input:
          args: "La feature active est dans le dossier {{ steps.feature.output.stdout }}. La vérification (types ou tests) échoue encore. Lis reports/test-report.txt, identifie la cause, corrige le code ou les tests concernés, sans ajouter de fonctionnalité hors spec."

  - id: verif_3
    type: shell
    run: "mkdir -p reports && ( {{ inputs.test_cmd }} ) > reports/test-report.txt 2>&1; echo TEST_EXIT=$?"

  - id: verdict
    type: if
    condition: "{{ steps.verif_3.output.stdout | contains('TEST_EXIT=0') }}"
    then:
      - id: converge
        command: speckit.converge
        integration: "{{ inputs.integration }}"
        input:
          args: "La feature active est dans le dossier {{ steps.feature.output.stdout }} : analyse uniquement ce dossier. Vérifie la complétude de l'implémentation par rapport à spec.md, plan.md et tasks.md. Écris le rapport dans convergence.md dans ce dossier."
    else:
      - id: echec
        type: shell
        run: "echo 'Vérification en échec après 2 corrections : arrêt, intervention humaine.'; exit 1"

  - id: bilan
    type: shell
    run: "d=$(python3 -c \"import json; print(json.load(open('.specify/feature.json'))['feature_directory'])\"); echo \"Tâches cochées : $(grep -c '^- \\[[xX]\\] T[0-9]' \"$d/tasks.md\") ; restantes : $(grep -c '^- \\[ \\] T[0-9]' \"$d/tasks.md\")\""
