name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'hygiène du dépôt (constitution, principe de sécurité)
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.(sqlite|db)$'; then
            echo "Fichier sensible ou base de données locale versionné." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test
